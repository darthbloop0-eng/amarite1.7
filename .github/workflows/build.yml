name: Build Amarite

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare sources
        run: python3 ci/port.py prepare

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Bundle Reach Entity Attributes (jar-in-jar)
        if: success()
        run: python3 ci/nest_jars.py | tee -a jars.txt

      - name: Summarize errors
        if: always()
        run: python3 ci/port.py summarize

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Inspect jars
        if: always()
        run: |
          for j in build/devlibs/*.jar build/libs/*.jar; do
            [ -f "$j" ] || continue
            echo "=== $j ($(unzip -l "$j" | tail -1))" | tee -a jars.txt
            unzip -l "$j" | grep -c "\.class" | sed 's/^/class files: /' | tee -a jars.txt
          done
          ls -la build/devlibs build/libs 2>&1 | tee -a jars.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-report
          path: jars.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amarite-jar-devlibs
          path: build/devlibs/*.jar

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amarite-jar-remapped
          path: build/libs/*.jar

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amarite-jar-bundled
          path: build/bundled/*.jar
